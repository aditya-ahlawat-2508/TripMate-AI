name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        env:
          GROQ_API_KEY: ci-placeholder
          AVIATIONSTACK_API_KEY: ci-placeholder
          TAVILY_API_KEY: ci-placeholder
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/travel_db
        run: pytest
