[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# E501: line length, not worth chasing. E402: several modules load .env and
# set SSL_CERT_FILE before importing anything that reads those at import
# time — top-of-file imports would break that ordering.
ignore = ["E501", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
